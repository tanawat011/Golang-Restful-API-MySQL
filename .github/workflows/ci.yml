name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: [oldstable, stable]
    services:
      mysql:
        image: mysql:8.4.13
        # Throwaway container that lives only for this job.
        env:
          MYSQL_ROOT_PASSWORD: ci-only-root
          MYSQL_DATABASE: golang_rest_api_example_test
          MYSQL_USER: app
          MYSQL_PASSWORD: ci-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pci-only-root --silent"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_USER: app
      DB_PASSWORD: ci-only
      TEST_DB_NAME: golang_rest_api_example_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go build ./...
      - name: go test (fails if a database test was skipped)
        run: |
          set -o pipefail
          go test -race -v ./... | tee test.log
          ! grep -- '--- SKIP' test.log

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # govulncheck v1.10.0 cannot load the Go 1.27 standard library yet
      # ("generic method requires go1.27"), so it runs on Go 1.26.
      - uses: actions/setup-go@v7
        with:
          go-version: oldstable
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
